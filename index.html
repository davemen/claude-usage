<p>Dave Mendlen's Claude plan usage and what his usage governor saved. Usage is the plan's own reading as Claude Code last reported it; savings are a list-price estimate. Published from his Mac when the numbers change, at most every 10 minutes.</p>
<script>
(function(){var read=1791513101,made=1791630445,el=document.getElementById("age");
function span(s){if(s<90)return Math.round(s)+"s";var m=Math.round(s/60);if(m<60)return m+"m";var h=Math.floor(m/60);return h<24?h+"h "+(m%60)+"m":Math.floor(h/24)+"d "+(h%24)+"h"}
function tick(){var now=Date.now()/1000;if(!read){el.textContent="no reading yet";return}
var age=now-read;el.textContent="usage read "+span(age)+" ago";el.setAttribute("fill",age>1800?"#fbbf24":"#64748b")}
tick();setInterval(tick,1000)})();
</script>
